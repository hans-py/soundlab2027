<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sound.Lab. | 碧風祭2027「llllink」</title>
<meta name="description" content="Sound.Lab. のサウンドカード。碧風祭2027「llllink」で配布している曲とMVを聴けます。">
<meta name="theme-color" content="#10105A">
<meta property="og:type" content="website">
<meta property="og:title" content="Sound.Lab. | 碧風祭2027「llllink」">
<meta property="og:description" content="サウンドカードの曲とMV">
<meta property="og:url" content="https://hans-py.github.io/soundlab2027/">
<meta property="og:image" content="https://hans-py.github.io/soundlab2027/assets/img/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="preload" as="image" href="assets/img/key-visual.webp" type="image/webp">
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.classList.add("is-loading")</script>
<noscript><style>.loader{display:none}html.is-loading{overflow:auto}</style></noscript>
</head>
<body>

<div class="loader" id="loader" aria-hidden="true">
  <p class="loader__num" id="loader-num">0%</p>
  <div class="loader__line"><span id="loader-bar"></span></div>
  <p class="loader__name">Sound.Lab.<small>碧風祭2027「llllink」</small></p>
  <i class="strip strip--1"></i><i class="strip strip--2"></i><i class="strip strip--3"></i><i class="strip strip--4"></i>
</div>

<main class="app">

  <div class="stage" id="stage" data-mode="song">
    <img class="stage__art" src="assets/img/key-visual.webp" width="1086" height="1536" fetchpriority="high"
         alt="桃色の瞳の少女と、胸元から放射状に広がる光のイラスト">
    <video class="stage__mv" id="mv" playsinline preload="none" hidden></video>
  </div>

  <header class="title">
    <p class="title__event" id="event"></p>
    <h1 class="title__name" id="circle"></h1>
  </header>

  <section class="player" aria-label="プレイヤー">
    <div class="player__top">
      <div class="tabs" role="tablist" aria-label="再生モード">
        <button class="tab" role="tab" id="tab-song" type="button" aria-selected="true" data-mode="song">曲</button>
        <button class="tab" role="tab" id="tab-mv" type="button" aria-selected="false" tabindex="-1" data-mode="mv">MV</button>
      </div>
      <a class="dl" id="dl" href="#" download>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v11m0 0 4.5-4.5M12 15l-4.5-4.5M5 19.5h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>MP3</span>
      </a>
    </div>

    <div class="now">
      <h2 class="now__title" id="now-title">&nbsp;</h2>
      <p class="now__by" id="now-by"></p>
    </div>

    <div class="seek">
      <input class="seek__range" id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="再生位置" aria-valuetext="0:00">
      <div class="seek__time"><span id="cur">0:00</span><span id="dur">–:–</span></div>
    </div>

    <div class="ctrl">
      <button class="icon-btn" id="prev" type="button" aria-label="前の曲">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19 5.7v12.6a.8.8 0 0 1-1.25.66L9 13.1a1 1 0 0 1 0-1.7l8.75-5.86A.8.8 0 0 1 19 5.7z" fill="currentColor"/></svg>
      </button>
      <button class="play" id="play" type="button" aria-label="再生">
        <svg class="play__i play__i--play" width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg>
        <svg class="play__i play__i--pause" width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="next" type="button" aria-label="次の曲">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 5.7v12.6a.8.8 0 0 0 1.25.66L15 13.1a1 1 0 0 0 0-1.7L6.25 5.54A.8.8 0 0 0 5 5.7z" fill="currentColor"/></svg>
      </button>
    </div>
  </section>

  <section class="sec" aria-labelledby="h-tracks">
    <h2 class="sec__label" id="h-tracks">収録曲</h2>
    <ol class="tracklist" id="tracklist"></ol>
  </section>

  <section class="sec" id="sec-lyrics" aria-labelledby="h-lyrics">
    <h2 class="sec__label" id="h-lyrics">歌詞</h2>
    <div class="lyrics" id="lyrics"></div>
    <p class="note">歌詞のコピー・転載はご遠慮ください</p>
  </section>

  <section class="sec" aria-labelledby="h-credits">
    <h2 class="sec__label" id="h-credits">クレジット</h2>
    <dl class="credits" id="credits"></dl>
  </section>

  <section class="sec" aria-labelledby="h-links">
    <h2 class="sec__label" id="h-links">リンク</h2>
    <ul class="links" id="links"></ul>
  </section>

  <footer class="foot">
    <p id="copyright"></p>
    <p id="notice"></p>
  </footer>

</main>

<audio id="audio" preload="metadata"></audio>

<script src="js/tracks.js"></script>
<script src="js/app.js"></script>
</body>
</html>
